services:
  - type: web
    name: sentinel-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString
      - key: FRONTEND_HOSTNAME
        fromService:
          type: web
          name: sentinel-ai-frontend
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: sentinel-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: export VITE_API_URL="https://${BACKEND_HOSTNAME}" && npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: BACKEND_HOSTNAME
        fromService:
          type: web
          name: sentinel-ai-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sentinel-ai-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: sentinelai
    user: sentinel
